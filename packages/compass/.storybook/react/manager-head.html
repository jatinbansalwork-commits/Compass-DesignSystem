<link href="https://cdn.jsdelivr.net/npm/@klearnow/compass@12.43.0/fonts.css" rel="stylesheet">
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/katorlys/prism-theme-github/themes/prism-theme-github-light.css">
<link rel="icon" href="/klearnow-logo.svg" type="image/svg+xml" />
<style>
  .sidebar-header img[alt='Compass logo'],
  .sidebar-header img[src*='compass-logo'],
  .sidebar-header img[src*='klearnow/compass'] {
    display: none !important;
  }
  .sidebar-header a[data-compass-brand='true'] {
    font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.02em;
    color: #003F5B;
    text-decoration: none;
  }
</style>
<script>
  (function () {
    var homePath = '/docs/guides-klear-for-ai-agents--docs';
    var params = new URLSearchParams(window.location.search);
    var currentPath = params.get('path');
    if (!currentPath) {
      window.location.replace('/?path=' + encodeURIComponent(homePath));
      return;
    }

    function patchSidebarBrand() {
      var header = document.querySelector('.sidebar-header');
      if (!header) return;
      var link = header.querySelector('a');
      if (!link) return;
      link.querySelectorAll('img').forEach(function (img) {
        img.remove();
      });
      if (link.getAttribute('data-compass-brand') !== 'true') {
        link.textContent = 'Compass';
        link.setAttribute('data-compass-brand', 'true');
        link.removeAttribute('href');
      }
    }
    patchSidebarBrand();
    new MutationObserver(patchSidebarBrand).observe(document.documentElement, {
      childList: true,
      subtree: true,
    });
  })();
</script>
